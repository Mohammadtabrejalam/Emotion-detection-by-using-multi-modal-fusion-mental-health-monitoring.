name: MindSense Academic Platform CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Typecheck & Build
        run: cd frontend && npm run build

  backend-test:
    name: Backend Pytest & Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests

  container-smoke:
    name: Container Build & Startup Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU application image
        run: docker build -t mindsense:ci .
      - name: Start container and verify frontend, API and missing-model behavior
        run: |
          docker run -d --name mindsense-ci -p 8000:8000 -e JWT_SECRET_KEY="$(openssl rand -hex 32)" mindsense:ci
          curl --retry 20 --retry-delay 2 --retry-connrefused -fsS http://127.0.0.1:8000/api/health
          python - <<'PY'
          import json, urllib.request, urllib.parse
          root = 'http://127.0.0.1:8000'
          assert 'MindSense' in urllib.request.urlopen(root).read().decode()
          assert not json.load(urllib.request.urlopen(root+'/api/models'))['data']['models']['text']['installed']
          request = urllib.request.Request(root+'/api/analyze', data=urllib.parse.urlencode({'text':'Container smoke test'}).encode())
          response = json.load(urllib.request.urlopen(request))
          assert response['error']['code'] == 'MODEL_UNAVAILABLE', response
          print('Container frontend, API, and fail-closed inference passed.')
          PY
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs mindsense-ci || true
          docker rm -f mindsense-ci || true
